<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h2 class="text-3xl font-extrabold text-indigo-700 mb-8 text-center">Mes Clubs</h2>

    <div *ngIf="clubs.length === 0" class="text-center text-gray-500 text-lg mt-12">
        Aucun club créé pour le moment.
    </div>

    <div *ngIf="clubs.length > 0" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
        <app-club-card *ngFor="let club of clubs" [club]="club"></app-club-card>
    </div>
</div>
