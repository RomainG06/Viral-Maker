<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-900 to-indigo-800">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Créer un compte 📝</h2>

        <form (ngSubmit)="register()" class="space-y-4">
            <div>
                <input [(ngModel)]="email" name="email" type="email" placeholder="Adresse email"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required />
            </div>

            <div>
                <input [(ngModel)]="password" name="password" type="password" placeholder="Mot de passe"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required />
            </div>

            <button type="submit" [disabled]="isLoading"
                class="w-full flex items-center justify-center bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 transition duration-300 disabled:opacity-50">
                <ng-container *ngIf="!isLoading; else loading">
                    S'inscrire
                </ng-container>
                <ng-template #loading>
                    <svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                    </svg>
                    Création...
                </ng-template>
            </button>

            <div *ngIf="errorMessage" class="text-red-500 text-sm text-center mt-2">
                {{ errorMessage }}
            </div>
        </form>

        <div class="text-center mt-4">
            <button type="button" (click)="goToLogin()" class="text-blue-600 hover:underline text-sm">
                Déjà un compte ? Se connecter
            </button>
        </div>
    </div>
</div>
