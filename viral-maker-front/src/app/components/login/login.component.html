<!-- Athletic Login Page - Dynamic & Energetic -->
<div
    class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-navy-950 via-navy-800 to-electric-900 animate-gradient-x">

    <!-- Animated Background Elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <!-- Floating Orbs -->
        <div class="absolute top-20 left-20 w-72 h-72 bg-electric-500/20 rounded-full blur-3xl animate-float"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-lime-500/10 rounded-full blur-3xl animate-float"
            style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 w-64 h-64 bg-navy-500/20 rounded-full blur-3xl animate-pulse-slow"></div>

        <!-- Grid Pattern -->
        <div class="absolute inset-0 bg-pattern-grid opacity-10"></div>
    </div>

    <!-- Login Card - Glassmorphism -->
    <div class="relative z-10 w-full max-w-md mx-4 animate-slide-up">
        <div class="card-glass p-8 sm:p-10 space-y-8">

            <!-- Header -->
            <div class="text-center space-y-3">
                <!-- Logo Icon -->
                <div
                    class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-lime-400 to-electric-500 rounded-2xl shadow-glow-lime mb-2">
                    <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z" />
                    </svg>
                </div>

                <h1 class="text-4xl font-display font-extrabold text-white text-shadow-lg">
                    Connexion
                </h1>
                <p class="text-graphite-300 text-sm font-medium">
                    Accédez à votre espace sportif
                </p>
            </div>

            <!-- Login Form -->
            <form (ngSubmit)="login()" class="space-y-5">

                <!-- Email Input -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-white/90">
                        Adresse email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-graphite-400" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                            </svg>
                        </div>
                        <input [(ngModel)]="email" name="email" type="email" placeholder="vous@exemple.com"
                            class="input-modern pl-12 text-graphite-800 placeholder-graphite-400" required />
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-white/90">
                        Mot de passe
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-graphite-400" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input [(ngModel)]="password" name="password" type="password" placeholder="••••••••"
                            class="input-modern pl-12 text-graphite-800 placeholder-graphite-400" required />
                    </div>
                </div>

                <!-- Error Message -->
                <div *ngIf="errorMessage"
                    class="flex items-center space-x-2 p-3 bg-red-500/20 border border-red-500/50 rounded-xl text-red-200 text-sm animate-fade-in">
                    <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                            clip-rule="evenodd" />
                    </svg>
                    <span>{{ errorMessage }}</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" [disabled]="isLoading"
                    class="w-full btn-accent flex items-center justify-center space-x-2 py-4 text-base font-bold disabled:opacity-50 disabled:cursor-not-allowed">
                    <ng-container *ngIf="!isLoading; else loading">
                        <span>Se connecter</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </ng-container>
                    <ng-template #loading>
                        <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                        </svg>
                        <span>Connexion en cours...</span>
                    </ng-template>
                </button>

                <!-- Divider -->
                <div class="relative py-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-white/20"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-transparent text-graphite-300 font-medium">
                            Nouveau sur ViralMaker ?
                        </span>
                    </div>
                </div>

                <!-- Register Link -->
                <button type="button" (click)="goToRegister()" class="w-full btn-ghost py-3 text-base font-semibold">
                    Créer un compte
                </button>
            </form>
        </div>

        <!-- Additional Info -->
        <div class="mt-6 text-center">
            <p class="text-graphite-300 text-sm">
                En continuant, vous acceptez nos
                <a href="#" class="text-lime-400 hover:text-lime-300 font-semibold transition-colors">
                    Conditions d'utilisation
                </a>
            </p>
        </div>
    </div>
</div>
