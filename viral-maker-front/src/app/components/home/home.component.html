<div
    class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex flex-col items-center p-6 space-y-8">

    <h1 class="text-5xl font-extrabold text-white text-center mt-8 drop-shadow-lg">Viral Maker 🎨✨</h1>

    <button
        class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-semibold py-3 px-6 rounded-2xl shadow-xl transition"
        (click)="buyCredits()">
        Acheter des crédits ⚡
    </button>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl w-full mt-8">

        <div *ngFor="let theme of themes"
            class="bg-white bg-opacity-20 backdrop-blur-lg rounded-3xl p-6 flex flex-col items-center text-white shadow-xl hover:scale-105 transition transform duration-300 ease-in-out cursor-pointer"
            (click)="testGenerateCaption(theme.name)">
            <div class="text-4xl mb-4">🎨</div>
            <h2 class="text-2xl font-bold mb-2">{{ theme.name }}</h2>
            <p class="text-center text-sm">Génère un contenu viral sur ce thème !</p>
        </div>
    </div>

    <div *ngIf="captions.length > 0" class="mt-4">
        <h2 class="text-xl font-bold mb-2">Résultats :</h2>
        <ul>
            <li *ngFor="let caption of captions">{{ caption }}</li>
        </ul>
    </div>

</div>
