<div class="card-glass p-6 space-y-4 border border-white/10 hover:border-lime-400/30 transition-all duration-300 hover:shadow-xl hover:shadow-lime-500/10 group animate-slide-up flex flex-col h-full min-h-[400px]"
    style="animation-delay: 0.3s;">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-white flex items-center space-x-3">
            <div
                class="w-10 h-10 bg-gradient-to-br from-lime-500 to-electric-400 rounded-lg flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            </div>
            <span>Événements</span>
        </h2>
    </div>

    <div class="space-y-3">
        <div *ngIf="upcomingEvents.length === 0" class="text-center py-8 text-graphite-400">
            <p>Aucun événement à venir</p>
            <button class="mt-4 text-lime-400 hover:text-lime-300 text-sm transition-colors">
                + Ajouter un événement
            </button>
        </div>

        <div *ngIf="upcomingEvents.length > 0" class="space-y-2">
            <div *ngFor="let event of upcomingEvents"
                class="bg-white/5 rounded-xl p-4 border border-white/5 hover:bg-white/10 transition-colors duration-200">
                <div class="flex items-start justify-between">
                    <div class="flex-1">
                        <p class="text-white font-semibold">{{ event.title }}</p>
                        <p class="text-graphite-400 text-sm mt-1">{{ event.club }}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-lime-400 text-sm font-semibold">{{ event.date | date:'dd/MM' }}</p>
                        <p class="text-graphite-500 text-xs">{{ event.date | date:'HH:mm' }}</p>
                    </div>
                </div>
            </div>
        </div>

        <button class="w-full btn-ghost text-sm px-4 py-2 flex items-center justify-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
            <span>Ajouter un événement</span>
        </button>
    </div>
</div>
