<div class="card-glass p-6 space-y-4 border border-white/10 hover:border-lime-400/30 transition-all duration-300 hover:shadow-xl hover:shadow-lime-500/10 group animate-slide-up flex flex-col h-full min-h-[400px]"
    style="animation-delay: 0.2s;">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-white flex items-center space-x-3">
            <div
                class="w-10 h-10 bg-gradient-to-br from-navy-400 to-navy-600 rounded-lg flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
            </div>
            <span>Mes clubs</span>
        </h2>
    </div>

    <div class="space-y-3">
        <div *ngIf="isLoading" class="text-graphite-400 text-center py-4">
            Chargement...
        </div>

        <div *ngIf="!isLoading && userClubs.length > 0" class="space-y-2">
            <div *ngFor="let club of userClubs.slice(0, 3)" (click)="onClubClick(club.slug)"
                class="bg-white/5 rounded-xl p-4 border border-white/5 hover:bg-white/10 hover:border-lime-400/30 cursor-pointer transition-all duration-200 flex items-center justify-between group/item">
                <div class="flex items-center space-x-3">
                    <div
                        class="w-10 h-10 bg-gradient-to-br from-lime-400 to-electric-500 rounded-lg flex items-center justify-center">
                        <span class="text-lg">🏆</span>
                    </div>
                    <div>
                        <p class="text-white font-semibold">{{ club.name }}</p>
                        <p class="text-graphite-400 text-xs">{{ club.city }}</p>
                    </div>
                </div>
                <svg class="w-5 h-5 text-lime-400 opacity-0 group-hover/item:opacity-100 group-hover/item:translate-x-1 transition-all duration-200"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </div>
        </div>

        <button (click)="onViewAllClick()"
            class="w-full btn-ghost text-sm px-4 py-2 flex items-center justify-center space-x-2">
            <span>Voir tous mes clubs</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>
    </div>
</div>
