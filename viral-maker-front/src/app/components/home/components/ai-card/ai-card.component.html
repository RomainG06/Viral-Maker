<div class="card-glass p-6 space-y-4 border border-white/10 hover:border-lime-400/30 transition-all duration-300 hover:shadow-xl hover:shadow-lime-500/10 group animate-slide-up flex flex-col h-full min-h-[400px]"
    style="animation-delay: 0.1s;">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-white flex items-center space-x-3">
            <div
                class="w-10 h-10 bg-gradient-to-br from-lime-400 to-lime-600 rounded-lg flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <span>Outils IA</span>
        </h2>
    </div>

    <p class="text-graphite-300 text-sm">
        Créez du contenu viral pour vos réseaux sociaux en quelques secondes avec notre IA.
    </p>

    <div class="flex-1 flex flex-col items-center justify-center space-y-3 py-4">
        <button (click)="onGenerateLogo()"
            class="w-full btn-accent text-base px-6 py-3 flex items-center justify-center space-x-2 hover:shadow-lg transition-all duration-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span>Générer le logo</span>
        </button>

        <button (click)="onGeneratePoster()"
            class="w-full btn-accent text-base px-6 py-3 flex items-center justify-center space-x-2 hover:bg-white/10 transition-all duration-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>Générer une affiche</span>
        </button>

        <button (click)="onGenerateAnnouncement()"
            class="w-full btn-accent text-base px-6 py-3 flex items-center justify-center space-x-2 hover:bg-white/10 transition-all duration-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
            </svg>
            <span>Post d'annonce</span>
        </button>

        <button (click)="onGenerateMatchStory()"
            class="w-full btn-accent text-base px-6 py-3 flex items-center justify-center space-x-2 hover:bg-white/10 transition-all duration-300">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
            </svg>
            <span>Story de match</span>
        </button>
    </div>

    <div *ngIf="captions.length > 0"
        class="bg-white/5 rounded-xl p-4 border border-white/5 max-h-40 overflow-y-auto space-y-2">
        <div *ngFor="let caption of captions" class="text-sm text-graphite-300 border-l-2 border-lime-400 pl-3 py-1">
            {{ caption }}
        </div>
    </div>
</div>
