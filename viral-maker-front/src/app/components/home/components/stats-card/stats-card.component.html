<div
    class="card-glass p-6 space-y-4 border border-white/10 hover:border-lime-400/30 transition-all duration-300 hover:shadow-xl hover:shadow-lime-500/10 group animate-slide-up flex flex-col h-full min-h-[400px]">
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold text-white flex items-center space-x-3">
            <div
                class="w-10 h-10 bg-gradient-to-br from-electric-400 to-electric-600 rounded-lg flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            </div>
            <span>Statistiques</span>
        </h2>
    </div>

    <div class="grid grid-cols-2 gap-4 pt-2">
        <div
            class="bg-white/5 rounded-xl p-4 border border-white/5 hover:bg-white/10 transition-colors duration-200 flex-1">
            <div class="text-3xl font-bold text-lime-400">{{ stats.totalClubs }}</div>
            <p class="text-sm text-graphite-400 mt-1">Mes clubs</p>
        </div>
        <div
            class="bg-white/5 rounded-xl p-4 border border-white/5 hover:bg-white/10 transition-colors duration-200 flex-1">
            <div class="text-3xl font-bold text-electric-400">{{ stats.aiGenerations }}</div>
            <p class="text-sm text-graphite-400 mt-1">Générations IA</p>
        </div>
        <div
            class="bg-white/5 rounded-xl p-4 border border-white/5 hover:bg-white/10 transition-colors duration-200 flex-1">
            <div class="text-3xl font-bold text-navy-400">{{ stats.totalPosts }}</div>
            <p class="text-sm text-graphite-400 mt-1">Publications</p>
        </div>
        <div
            class="bg-white/5 rounded-xl p-4 border border-white/5 hover:bg-white/10 transition-colors duration-200 flex-1">
            <div class="text-3xl font-bold text-lime-500">{{ stats.followers }}</div>
            <p class="text-sm text-graphite-400 mt-1">Abonnés</p>
        </div>
    </div>
</div>
